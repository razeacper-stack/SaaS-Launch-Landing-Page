<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#635bff" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="950" cy="150" r="300" fill="#635bff" opacity="0.15" />
  <circle cx="200" cy="480" r="250" fill="#8b5cf6" opacity="0.1" />
  
  <!-- Logo -->
  <g transform="translate(100, 100)">
    <rect width="64" height="64" rx="16" fill="url(#primaryGrad)" />
    <polygon points="36 8 12 36 32 36 28 56 52 28 32 28 36 8" fill="#ffffff" />
    <text x="84" y="44" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="36" font-weight="800">SaaS Launch</text>
  </g>

  <!-- Tagline -->
  <text x="100" y="260" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="64" font-weight="800" letter-spacing="-1">
    Launch Your Next Big Idea, Faster.
  </text>
  <text x="100" y="325" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="28" font-weight="400">
    The high-converting, accessible SaaS landing page template built with pure HTML5, CSS3, &amp; Vanilla JS.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 420)">
    <rect width="220" height="52" rx="26" fill="#1e293b" stroke="#334155" />
    <text x="110" y="32" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="18" font-weight="600" text-anchor="middle">⚡ Pure Vanilla Web</text>

    <rect x="240" width="240" height="52" rx="26" fill="#1e293b" stroke="#334155" />
    <text x="360" y="32" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="18" font-weight="600" text-anchor="middle">🎨 CSS Design System</text>

    <rect x="500" width="260" height="52" rx="26" fill="#1e293b" stroke="#334155" />
    <text x="630" y="32" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="18" font-weight="600" text-anchor="middle">📱 100% Mobile Ready</text>
  </g>
</svg>
